[package]
name = "ash-runtime"
version = "0.1.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/betacatsling/ash"
description = "Local and remote session runtime for the Ash macOS workspace"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
fs2 = "0.4"
libc = "0.2"

[profile.release]
strip = true
lto = "thin"
