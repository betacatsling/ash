name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Rust runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo test --locked --manifest-path runtime/Cargo.toml

  macos:
    name: macOS app and model checks
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build app
        run: swift build
      - name: XCTest checks
        run: swift test
      - name: Standalone model checks
        run: |
          for check in ModelChecks TerminalEnvironmentChecks ChecklistChecks SidePanelChecks DirectorySuggestionsChecks; do
            scripts/swift-check.sh "$check"
            ".build/$check"
          done
